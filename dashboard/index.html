<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f2" />
    <title>SEIKEI | 開発ダッシュボード</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="page-head">
        <div><p class="eyebrow">LOCAL DEVELOPMENT · SEIKEI</p><h1>開発ダッシュボード<span class="live"><i></i> ローカル</span></h1><p class="lead">進み具合、質問、成果物をここで確認できるで。</p></div>
        <div class="head-actions"><a class="button dark" href="/" target="_blank" rel="noopener">アプリを開く ↗</a><button class="button" id="run-tests">テスト実行</button><button class="button" id="refresh">更新 ↻</button></div>
      </header>

      <div class="notice" id="notice" role="status" hidden></div>
      <section class="metrics" id="metrics" aria-label="開発の概要"></section>

      <section class="section" aria-labelledby="task-title">
        <div class="section-head"><div><p class="eyebrow">01 / WORK</p><h2 id="task-title">タスク</h2></div><span class="section-meta" id="task-meta"></span></div>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>状態</th><th>題</th><th>blocker</th></tr></thead><tbody id="tasks"></tbody></table></div>
        <form class="inline-form" id="task-form"><label class="sr-only" for="task-title-input">新しいタスク</label><input id="task-title-input" name="title" placeholder="新しいタスクを追加" maxlength="200" required /><button class="button dark" type="submit">追加 +</button></form>
      </section>

      <section class="section" aria-labelledby="question-title">
        <div class="section-head"><div><p class="eyebrow">02 / DECISIONS</p><h2 id="question-title">未回答の質問</h2></div><span class="section-meta" id="question-meta"></span></div>
        <div class="question-list" id="questions"></div>
        <details class="add-question"><summary>開発側から質問を追加</summary><form id="question-form"><label for="question-input">質問</label><textarea id="question-input" name="question" rows="2" maxlength="500" required></textarea><div class="form-row"><label>緊急度 <select name="urgency"><option value="normal">通常</option><option value="high">高</option></select></label><label>回答がない場合の行動 <input name="defaultAction" maxlength="300" placeholder="任意" /></label></div><button class="button dark" type="submit">質問を保存</button></form></details>
      </section>

      <section class="section" aria-labelledby="artifact-title">
        <div class="section-head"><div><p class="eyebrow">03 / OUTPUT</p><h2 id="artifact-title">最新の成果物</h2></div><span class="section-meta" id="artifact-meta"></span></div>
        <div class="artifact-grid"><div class="preview-panel"><div class="panel-bar"><strong>アプリのプレビュー</strong><button class="small-button" id="reload-preview">再読み込み ↻</button></div><div class="preview-frame"><iframe title="SEIKEIアプリのプレビュー" id="app-preview" src="/"></iframe></div></div><div class="artifact-panel"><div class="panel-bar"><strong>保存済みの画面</strong><span>新しい順</span></div><div id="artifacts"></div></div></div>
      </section>

      <section class="section" aria-labelledby="review-title">
        <div class="section-head"><div><p class="eyebrow">04 / FEEDBACK</p><h2 id="review-title">成果物へのレビュー</h2></div><span class="section-meta" id="review-meta"></span></div>
        <div class="review-layout"><form class="review-form" id="review-form"><label for="review-target">対象</label><input id="review-target" name="target" maxlength="200" placeholder="例：年号暗記の画面" /><label for="review-note">気づいたこと・直してほしいこと</label><textarea id="review-note" name="note" rows="4" maxlength="1000" placeholder="スマホから短く書くだけでも大丈夫やで" required></textarea><button class="button dark" type="submit">レビューを保存 ↗</button></form><div class="reviews" id="reviews"></div></div>
      </section>

      <footer>この画面と入力内容は、このパソコンのローカルサーバーに保存されます。 <span id="updated"></span></footer>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
